
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI 계산기</title>
</head>
<body>

  <h1>BMI 계산기</h1>

  <div>
    <label for="height">키(cm)</label>
    <input type="text" id="height" placeholder="예:170">
  </div>

  <div>
    <label for="weight">몸무게(kg)</label>
    <input type="text" id="weight" placeholder="예:70">
  </div>

  <button onclick="calculateBMI()">계산하기</button>

  <h2 id="result"></h2>
  <h3 id="state"></h3>

  <!-- BMI 게이지 바 영역 -->
  <div class="bmi-gauge-container">
    <div id="gauge-pointer" class="gauge-pointer">▼</div>

    <div class="bmi-gauge-bar">
      <div class="gauge-section underweight">저체중</div>
      <div class="gauge-section normal">정상</div>
      <div class="gauge-section overweight">비만전단계</div>
      <div class="gauge-section obese1">1단계 비만</div>
      <div class="gauge-section obese2">2단계 비만</div>
      <div class="gauge-section obese3">3단계 비만</div>
    </div>

    <div class="gauge-ticks">
      <span>0</span>
      <span>18.5이상</span>
      <span>23이상</span>
      <span>25이상</span>
      <span>30이상</span>
      <span>35이상</span>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
